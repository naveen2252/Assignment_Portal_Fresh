<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | Assignment Portal</title><link rel="stylesheet" href="css/style.css"></head><body><main class="container"><header><h1>Admin Dashboard</h1><a href="index.html">Student Portal</a></header>
<section id="loginPanel" class="card"><h2>Admin Login</h2><form id="loginForm"><label>Username<input id="username" type="text" required autocomplete="username" placeholder="Admin"></label><label>Password<input id="password" type="password" required></label><button type="submit">Login</button></form><p id="loginStatus" class="status" role="status"></p></section>
<section id="dashboard" hidden><section class="card"><div class="actions"><h2>Deadline Settings</h2><button class="secondary" id="logoutBtn">Logout</button></div><label>Deadline (your browser's local time)<input id="deadlineInput" type="datetime-local"></label><button id="saveDeadlineBtn">Save / Extend Deadline</button><p id="deadlineStatus" class="status" role="status"></p></section>
<section class="card"><div class="actions"><h2>Submissions: <span id="count">0</span></h2><div><button id="refreshBtn" class="secondary">Refresh</button><button id="downloadAllBtn" class="secondary">Download ZIP</button><button id="clearBtn" class="danger">Delete All</button></div></div><p id="dashStatus" class="status" role="status"></p><div class="tablewrap"><table><thead><tr><th>Name</th><th>SAP ID</th><th>Assignment</th><th>File</th><th>Submitted</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></section></section></main><footer class="site-footer">© 2026 Assignment Submission Portal | Developed by Naveen</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><script src="js/config.js"></script><script src="js/admin.js"></script></body></html>
