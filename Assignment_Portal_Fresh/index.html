<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Assignment Submission Portal</title><link rel="stylesheet" href="css/style.css"></head><body>
<main class="container"><header><h1>Assignment Submission Portal</h1><p>Upload your Word assignment before the deadline.</p><a href="admin.html">Admin Login</a></header>
<section class="card"><div id="deadlineInfo" class="notice">Checking deadline…</div><div id="countdown" class="timer"></div>
<form id="studentForm"><label>Student Name<input name="username" required maxlength="100" autocomplete="name"></label><label>SAP ID<input name="sap_id" required maxlength="50"></label><label>Assignment Title<input name="assignment_title" required maxlength="150"></label><label>Word File (.doc, .docx; max 10 MB)<input name="assignment" type="file" accept=".doc,.docx" required></label><button id="submitBtn" type="submit">Submit Assignment</button></form><p id="status" class="status" role="status"></p></section></main><footer class="site-footer">© 2026 Assignment Submission Portal | Developed by Naveen</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="js/config.js"></script><script src="js/student.js"></script></body></html>
